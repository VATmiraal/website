<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Van typmachine tot Heimdall</title>
<style>
/* VOICE: playful but precise, a short game in the VATmiraal house style
   IDEA: an accounting office that evolves era by era (this build: eras 1 and 2)
   PICTURE: pixel office (320x180 at integer scale) that changes with each era
   COLOUR and TYPE: house palette, Inter, flat fills, hairline cards
   LAYOUT: scene left, control panel right; stacked below 900px; dialogs as modal sheets */
@font-face{font-family:"Inter";src:url("/Inter-VariableFont_opsz%2Cwght.ttf") format("truetype");font-weight:100 900;font-display:swap}
:root{color-scheme:light;
  --bg:#f8f8f6;--card:#ffffff;--ink:#0f0f0f;--muted:rgba(15,15,15,.7);--faint:rgba(15,15,15,.45);
  --line:rgba(15,15,15,.09);--line2:rgba(15,15,15,.14);--acc:#2c3e76;--acc-t:#eef0f7;--mark:#1b2a4a;
  --proof:#1f6b4f;--proof-t:#e7f0eb;--risk:#98302f;--risk-t:#f4e6e5;--ins-t:#f0f0ee;--att:#97681c;--att-t:#f6eedd;
  --shadow:0 2px 8px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;padding:14px max(3vw,16px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:0}
.chip{font-size:13px;font-weight:600;color:var(--acc);background:var(--acc-t);border-radius:999px;padding:4px 12px;white-space:nowrap}
.tb{margin-left:auto;display:flex;gap:6px}
.tb button{min-height:36px;min-width:44px;padding:0 12px;border:1px solid var(--line2);background:var(--card);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.tb button.on{background:var(--ink);color:#f8f8f6;border-color:var(--ink)}
button:focus-visible,#scene:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,1fr);gap:24px;padding:20px max(3vw,16px) 28px;max-width:1500px;margin:0 auto}
.stage{position:relative;align-self:start}
#scene{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;border-radius:10px;background:#eeece6;cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow)}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:clamp(20px,5vw,64px);border-radius:10px;background:rgba(15,15,15,.8);color:#f8f8f6;opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
.ov.show{opacity:1;pointer-events:auto}
.ov .k{font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:rgba(248,248,246,.55);margin:0 0 12px}
.ov h2{font-size:clamp(28px,4.4vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:0 0 12px;text-wrap:balance}
.ov p{font-size:clamp(15px,1.6vw,20px);color:rgba(248,248,246,.8);margin:0 0 22px;max-width:40em}
.btn{min-height:48px;padding:0 22px;border-radius:10px;border:0;background:var(--ink);color:#f8f8f6;font-weight:700;font-size:16px;cursor:pointer}
.jump{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:rgba(248,248,246,.6)}.jump span{margin-right:2px}.jump button{min-width:36px;min-height:32px;border-radius:8px;border:1px solid rgba(248,248,246,.35);background:transparent;color:#f8f8f6;font:inherit;font-weight:700;cursor:pointer}.jump button:hover{background:rgba(248,248,246,.12)}
.ov .btn{align-self:flex-start;background:#f8f8f6;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.hint{position:absolute;left:16px;bottom:16px;max-width:min(520px,80%);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--muted);opacity:0;transform:translateY(6px);transition:opacity .4s var(--ease),transform .4s var(--ease);pointer-events:none}
.hint.show{opacity:1;transform:none}
.ban{position:absolute;left:16px;right:calc(28% + 6px);top:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);box-shadow:var(--shadow);border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.4;opacity:0;transform:translateY(-6px);transition:opacity .35s var(--ease),transform .35s var(--ease);pointer-events:none}
.ban.show{opacity:1;transform:none;pointer-events:auto}
.ban.warn{border-left-color:var(--att)}
.ban b{font-weight:700}
.ban span{flex:1 1 220px}
.ban button{min-height:40px;padding:0 14px;border-radius:8px;border:0;background:var(--mark);color:#f8f8f6;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.panel{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:18px}
.kick{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.goal{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;margin-bottom:8px}.goal b{white-space:nowrap}
.goal b{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.goal span{font-size:14px;color:var(--faint);white-space:nowrap}
.meter{height:8px;background:var(--ins-t);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s var(--ease)}
.stats{display:grid;grid-template-columns:minmax(0,1.8fr) repeat(3,minmax(0,1fr));gap:10px 18px;margin-top:16px}.st b.l1{font-size:19px}.st b.l2{font-size:16px}
.st{border-top:1px solid var(--line);padding-top:10px}
.st b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.st span{font-size:12px;color:var(--faint)}
.fines{margin-top:12px;font-size:13px;color:var(--faint);display:flex;justify-content:space-between;gap:8px}
.fines b{color:var(--risk);font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.acts.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
#tap,#fill{width:100%;min-height:64px;border:0;border-radius:10px;background:var(--mark);color:#f8f8f6;font-weight:800;font-size:19px;letter-spacing:-.01em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;overflow:hidden}
#fill{background:var(--acc)}
#tap,#fill{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#fill .cd{position:absolute;left:0;bottom:0;height:4px;background:rgba(248,248,246,.6)}
#fill.on{background:#3a5296}
#tap[disabled],#fill[disabled]{background:#c9c9c6;cursor:default}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 10px;padding:8px 0;border-top:1px solid var(--line)}.rrow:first-child{border-top:0}.rrow span{font-size:14px;font-weight:600}.rrow .seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.seg button{min-height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:var(--card);font-size:13px;font-weight:600;cursor:pointer}.seg button.on{background:var(--mark);color:#f8f8f6;border-color:var(--mark)}.rrow.badrule span{color:var(--risk)}.rnote{font-size:12.5px;color:var(--faint);margin:8px 0 0}
.verd{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:6px;font-size:12.5px;font-weight:700;color:#f8f8f6}.verd.x{background:var(--risk)}.verd.q{background:#8a8a88}.verd.e{background:var(--mark)}.why{display:block;font-size:14px;margin-top:6px;line-height:1.45}
.choices.two{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:600px){.choices.two{grid-template-columns:1fr}}.choices.one{grid-template-columns:minmax(0,1fr)}table.fin{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 14px}table.fin th{text-align:left;font-size:12px;font-weight:600;color:var(--faint);padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}table.fin td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;font-weight:600}table.fin td small{display:block;font-weight:400;color:var(--faint);font-size:12px}table.fin td.bad{color:var(--risk)}table.fin td.okc{color:#1f6b4f}.big.sm b{font-size:30px}.big.sm{gap:8px 24px}
.float.neg{color:var(--risk)}
.brand{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}.small{font-size:12.5px;color:var(--faint)}
.agl{display:block;font-size:14px;margin-top:6px}.agl b{font-weight:700}#chkWhy{display:block;font-size:14px;font-style:italic;color:var(--faint);margin-top:4px;quotes:'“' '”'}.cbtns.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.inv.ok{border-color:var(--proof);background:var(--proof-t)}.inv.bad{border-color:var(--risk);background:var(--risk-t)}.inv .res{font-size:13px;font-weight:700;min-height:18px}.inv.ok .res{color:var(--proof)}.inv.bad .res{color:var(--risk)}.cbtns button.hitok{background:var(--proof)!important}.cbtns button.hitbad{background:var(--risk)!important}
.inv{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}.inv .kick{margin:0}.inv b{font-size:16px;font-weight:700}
.cbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}.cbtns button{min-height:56px;border:0;border-radius:10px;background:var(--mark);color:#f8f8f6;font-weight:700;font-size:15px;cursor:pointer;line-height:1.2;padding:6px}.cbtns button[disabled]{background:#c9c9c6;cursor:default}.cbtns button:active{transform:translateY(1px)}
#fill small{font-weight:600;font-size:13px;opacity:.75;white-space:nowrap}
.keys{display:flex;gap:4px}
.keys i{width:10px;height:10px;border-radius:2px;background:rgba(248,248,246,.25)}
.keys i.on{background:#f8f8f6}
.ups{display:flex;flex-direction:column;gap:8px}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--card);cursor:pointer;transition:border-color .2s var(--ease)}
.up:hover:not([disabled]){border-color:var(--acc)}
.up[disabled]{cursor:default;opacity:.5}
.up.new{border-color:var(--att)}
.up .n{font-weight:700;font-size:15px}
.up .n em{font-style:normal;font-weight:600;color:var(--acc);margin-left:6px;font-size:13px}
.up .c{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;align-self:center;grid-row:span 2;color:var(--acc)}
.up .d{font-size:13px;color:var(--muted);line-height:1.4}
.up .fx{grid-column:1/-1;font-size:12.5px;font-weight:600;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1.4;min-height:2.8em}
.up .fx i{font-style:normal} /* at least two lines high: a changing number never makes the card grow or shrink */
.up.fresh{animation:upIn 1.6s var(--ease)}
@keyframes upIn{0%{border-color:var(--att);box-shadow:0 0 0 3px rgba(224,160,48,.35)}100%{box-shadow:0 0 0 0 rgba(224,160,48,0)}}
/* bought upgrades leave the list and become a quiet row of chips, so the list only changes when you buy */
.owned{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;align-items:center}
.owned[hidden]{display:none}
.owned .ok{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-right:2px}
.owned .chip{font-size:12px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;white-space:nowrap}
.foot{font-size:12px;color:var(--faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot button{border:0;background:none;padding:0;font-size:12px;color:var(--faint);text-decoration:underline;cursor:pointer;min-height:24px}
.float{position:absolute;font-weight:800;font-size:15px;color:var(--acc);pointer-events:none;animation:fl 1s var(--ease) forwards}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-26px)}}
.modal{position:fixed;inset:0;background:rgba(15,15,15,.55);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .35s var(--ease);z-index:10}
.modal.show{opacity:1;pointer-events:auto}
.sheet{background:var(--bg);border-radius:14px;max-width:760px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:clamp(20px,4vw,36px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet h2{font-size:clamp(26px,3.6vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.08;margin:0 0 10px;text-wrap:balance}
.sheet p{margin:0 0 16px;color:var(--muted);max-width:44em}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:18px 0}
.choice{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border:1px solid var(--line2);border-radius:10px;background:var(--card);cursor:pointer;min-height:44px}
.choice:hover:not([disabled]){border-color:var(--acc)}
.choice[disabled]{opacity:.45;cursor:default}
.choice b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.choice .pr{font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.choice span{font-size:13px;color:var(--muted);line-height:1.4}
.choice dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin:6px 0 0;font-size:13px}
.choice dt{color:var(--faint)}.choice dd{margin:0;font-weight:600}
.big{display:flex;gap:28px;flex-wrap:wrap;margin:8px 0 18px}
.big div b{display:block;font-size:clamp(34px,5vw,56px);font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.big div span{font-size:13px;color:var(--faint)}
.big .r b{color:var(--risk)}
.who{font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 14px}
.have{font-size:14px;color:var(--faint)}
.tl{margin:6px 0 18px}.tl svg{display:block;width:100%;height:auto}.tl .lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:8px}.tl .lg b{color:var(--acc);font-variant-numeric:tabular-nums;margin-right:4px}.tl h3{font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}.have b{color:var(--ink);font-variant-numeric:tabular-nums}
@media(max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){#ovIntro:not(.show){display:none}#ovIntro.show{position:relative;inset:auto;margin-top:8px;padding:22px 20px}#ovIntro h2{font-size:30px}#ovIntro p{font-size:15px;margin-bottom:16px}.rrow{grid-template-columns:1fr}.rrow .seg{justify-content:flex-start}.cbtns button{font-size:15px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.hint{position:static;max-width:none;margin-top:8px;font-size:13px}.ban{position:static;margin-top:8px}.top{gap:8px}.top h1{font-size:15px}.goal b{font-size:24px}.st b{font-size:18px}#tap,#fill{min-height:58px;font-size:17px}.ups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.up{grid-template-columns:1fr;gap:3px;padding:9px 10px;align-content:start}.up .n{font-size:13.5px;line-height:1.25}.up .n em{margin-left:4px;font-size:12px}.up .c{grid-row:auto;align-self:start;font-size:13px}.up .d{display:none}.up .fx{font-size:11.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.card{padding:14px}.stats{gap:8px 14px;margin-top:12px}.st{padding-top:7px}.st span{font-size:11.5px}}
@media(prefers-reduced-motion:reduce){.float{animation:none;opacity:0}.ov,.hint,.ban,.modal{transition:none}}

/* phones: the whole game on one screen. Banners and hints float inside the scene, stats in one row, upgrades scroll sideways */
@media(max-width:600px){
  .top{padding:7px 10px;gap:6px;flex-wrap:nowrap}.top h1{display:none}.top .chip{font-size:11.5px;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .tb{margin-left:auto;gap:4px;flex-shrink:0}.tb button{min-height:28px;padding:0 7px;font-size:11.5px}
  .wrap{padding:8px 10px 14px;gap:8px}.panel{gap:8px}.card{padding:10px 12px}
  .ban{position:absolute;left:6px;right:calc(28% + 4px);top:6px;margin:0;padding:5px 8px;font-size:11px;line-height:1.3;gap:4px 6px;border-left-width:3px}
  .ban span{flex:1 1 100%}.ban button{min-height:28px;padding:0 10px;font-size:12px}
  .hint{position:absolute;left:6px;right:6px;bottom:6px;max-width:none;margin:0;padding:5px 8px;font-size:11px;line-height:1.3}
  #lGoal{display:none}.goal{margin-bottom:5px}.goal b{font-size:19px}.goal span{font-size:11px}.meter{height:5px}
  .stats{grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:4px 8px;margin-top:8px}.st{padding-top:5px}
  .st b{font-size:14px}.st b.l1{font-size:12.5px}.st b.l2{font-size:11px}.st span{font-size:10px}
  .fines{margin-top:5px;font-size:11px}
  #tap,#fill{min-height:48px;font-size:16px}.cbtns button{min-height:44px;font-size:14px}
  .inv{padding:8px 10px}.inv b{font-size:14px}.inv .kick{font-size:10.5px}.why,.agl,#chkWhy{font-size:12.5px}.res{font-size:12px}.rnote{font-size:11px;margin-top:4px}
  .kick{font-size:10.5px;margin-bottom:6px}
  .ups{display:flex;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .ups{align-items:stretch}.up{flex:0 0 62%;scroll-snap-align:start;padding:7px 9px;align-content:start}
  .up .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.up .fx{height:4.05em;min-height:0}.up .fx i{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .owned{flex:0 0 62%;scroll-snap-align:start;margin:0;gap:4px;align-content:flex-start;padding:7px 9px;border:1px dashed var(--line2);border-radius:10px}.owned .chip{font-size:11px;padding:1px 7px}.owned .ok{font-size:10px;flex:1 1 100%}
  .evon #chk{display:none} /* a dossier event takes the place of the sample check until it is answered */
  .inv .res{min-height:0}
  .rrow{grid-template-columns:minmax(0,1fr) auto;padding:5px 0;gap:4px 8px}.rrow span{font-size:12.5px;line-height:1.25}.seg{gap:3px}.seg button{min-height:30px;padding:0 6px;font-size:11.5px}#rNote{display:none}
  .cbtns button{padding:0 4px;line-height:1.2}
  .foot{font-size:11px}
}
</style>
</head>
<body>
<header class="top">
  <h1 id="tTitle"></h1><span class="chip" id="tEra"></span>
  <div class="tb"><button id="bNL">NL</button><button id="bEN">EN</button><button id="bFR">FR</button><button id="bMus" aria-pressed="true"></button><button id="bSnd" aria-pressed="true"></button></div>
</header>
<main class="wrap">
  <div class="stage">
    <canvas id="scene" width="320" height="180" tabindex="0"></canvas>
    <div class="ban" id="ban" role="status"><span id="banT"></span><button id="banB" hidden></button></div>
    <div class="hint" id="hint"></div>
    <div class="ov" id="ovIntro"><p class="k" id="iK"></p><h2 id="iH"></h2><p id="iP"></p><button class="btn" id="bStart"></button><div class="jump"><span id="jumpL"></span><button data-jump="2">2</button><button data-jump="3">3</button><button data-jump="4">4</button><button data-jump="5">5</button><button data-jump="6">6</button></div></div>
    <div class="ov" id="ovEra"><p class="k" id="eK"></p><h2 id="eH"></h2><p id="eP"></p></div>
  </div>
  <div class="panel">
    <section class="card">
      <p class="kick" id="lGoal"></p>
      <div class="goal"><b id="vDone">0</b><span id="vGoal"></span></div>
      <div class="meter"><i id="mGoal"></i></div>

  cases:[['Consult BV · advice, established in the Netherlands','Charged Dutch VAT. A service between businesses is taxed where your client is established (art. 21, §2 VAT Code); your client reverse-charges the VAT (art. 51, §2, first paragraph, 1° VAT Code).','Request a credit note'],
    ['Müller GmbH · parts, shipped from Germany','Charged German VAT, although your client gave its Belgian VAT number. The goods left Germany: an intra-EU acquisition in Belgium (art. 25bis VAT Code).','Request a credit note'],
    ['Wouters bakery · cakes, supplied without service','Charged 21%. A supply of foodstuffs falls under 6% (Royal Decree no. 20, table A).','Request a credit note'],
    ['Maes office supplies · toner','Your client\'s VAT number is missing from the invoice (art. 5, §1 Royal Decree no. 1). No correct invoice, no deduction.','Request a new invoice'],
    ['De Gouden Lepel restaurant · lunch with clients','The booking proposal deducts the VAT. VAT on food and drink is not deductible (art. 45, §3, 3° VAT Code).','Adjust the proposal'],
    ['Garage Janssens · passenger car service','The booking proposal deducts all VAT. For a passenger car, deduction is capped at 50% (art. 45, §2 VAT Code).','Adjust the proposal'],
    ['Garage Janssens · company vehicle service','Is it a passenger car or a light truck? That decides whether deduction is capped (art. 45, §2 VAT Code).','Ask the client'],
    ['Software Ltd · licences, established in Ireland','Is the licence for the business or for the director privately? That decides where the service is taxed (art. 21 and 21bis VAT Code).','Ask the client'],
    ['Van Dijk BV · racks','From which member state did the goods leave? The transport document is missing, and it decides whether there is an intra-EU acquisition (art. 25bis VAT Code).','Ask the client'],
    ['Claes electrics · laptops for Dr Maes\'s practice','The booking proposal deducts all VAT. Your client also makes exempt supplies: deduction by the general pro rata (art. 46, §1 VAT Code).','Adjust the proposal'],
    ['Peeters real estate · office building, now let exempt','The building is used exempt within the 15-year revision period. Revision: repay 9/15 of the deducted VAT (art. 48, §2 VAT Code).','Calculate the revision'],
    ['Dr Maes · definitive pro rata','The definitive pro rata (62%) differs from the provisional one (70%): revise the deduction for the whole year (art. 46, §1 VAT Code).','Book the correction'],
    ['Hotel Ter Duinen · stay in April, booked on 20 February','Charged 12%. The booking predates 1 March 2026 and the VAT becomes due before 30 June: the transitional rule keeps it at 6%. VAT on accommodation is not deductible for your client (art. 45, §3, 3° VAT Code), so the difference is simply cost.','Request a credit note'],
    ['Müller GmbH · machines, straight from Germany to France','The booking proposal books an intra-EU acquisition in Belgium, but the goods never came here. Triangulation with your client as the intermediary: the French customer pays the VAT (art. 141 and 197 VAT Directive), and your client\'s invoice must say "reverse charge".','Adjust the proposal'],
    ['Wouters printers · invoice as a PDF by email','Since 1 January 2026 an invoice between Belgian VAT-registered businesses must be structured and electronic, via Peppol (law of 6 February 2024). The first-quarter tolerance is over: a PDF is not a valid invoice.','Request a Peppol invoice']],

  cases:[['Consult BV · conseil, établi aux Pays-Bas','A facturé la TVA néerlandaise. Une prestation de services entre entreprises est imposable là où votre client est établi (art. 21, §2 du Code TVA) ; votre client autoliquide la TVA (art. 51, §2, alinéa 1er, 1° du Code TVA).','Demander une note de crédit'],

    ['Restaurant De Gouden Lepel · lunch avec des clients','La proposition de comptabilisation déduit la TVA. La TVA sur les repas et boissons n\'est pas déductible (art. 45, §3, 3° du Code TVA).','Adapter la proposition'],
    ['Garage Janssens · entretien d\'une voiture','La proposition de comptabilisation déduit toute la TVA. Pour une voiture, la déduction est limitée à 50 % (art. 45, §2 du Code TVA).','Adapter la proposition'],

    ['Software Ltd · licences, établi en Irlande','La licence est-elle pour l\'entreprise ou pour le gérant à titre privé ? Cela détermine où le service est imposable (art. 21 et 21bis du Code TVA).','Demander au client'],
    ['Van Dijk BV · rayonnages','De quel État membre les biens sont-ils partis ? Le document de transport manque, et il détermine s\'il y a une acquisition intracommunautaire (art. 25bis du Code TVA).','Demander au client'],

    ['Hôtel Ter Duinen · nuitée en avril, réservée le 20 février','A facturé 12 %. La réservation est antérieure au 1er mars 2026 et la TVA devient exigible avant le 30 juin : le régime transitoire la maintient à 6 %. La TVA sur le logement n\'est pas déductible pour votre client (art. 45, §3, 3° du Code TVA), la différence est donc simplement un coût.','Demander une note de crédit'],
    ['Müller GmbH · machines, directement d\'Allemagne vers la France','La proposition de comptabilisation inscrit une acquisition intracommunautaire en Belgique, mais les biens ne sont jamais venus ici. Opération triangulaire avec votre client comme intermédiaire : le client français acquitte la TVA (art. 141 et 197 de la directive TVA), et la facture de votre client doit porter la mention "Autoliquidation".','Adapter la proposition'],
